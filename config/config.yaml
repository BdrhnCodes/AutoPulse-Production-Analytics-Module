project:
  name: "AutoPulse Manufacturing Analytics"
  phase: 1 # The second one will be about sales.
  random_seed: 42

date_range:
  start_date: "2024-07-01"
  end_date: "2026-07-31"

brand:
  name: "Jungle Motors"

models:
  count: 4
  definitions:
  - model_name: "Jungle Fennec"
    segment: "Hatchback"
    engine_type: "1.4L Petrol"
    transmission_type: "Manual"
    drivetrain: "FWD" # Front-Wheel Drive
    base_price: 19200
    standard_labor_hours: 16.0
    standard_cycle_time_minutes: 432
  - model_name: "Jungle Lynx"
    segment: "Sedan"
    engine_type: "1.6L Diesel"
    transmission_type: "Automatic"
    drivetrain: "FWD"
    base_price: 25100
    standard_labor_hours: 19.0
    standard_cycle_time_minutes: 476
  - model_name:  "Jungle Tiger"
    segment: "SUV"
    engine_type: "2.0L Petrol"
    transmission_type: "Automatic"
    drivetrain: "AWD" # All-Wheel Drive
    base_price: 32400
    standard_labor_hours: 24.0
    standard_cycle_time_minutes: 568
  - model_name: "Jungle Owl"
    segment: "EV"
    engine_type: "Electric"
    transmission_type: "Automatic"
    drivetrain: "AWD"
    base_price: 33000
    standard_labor_hours: 18.0
    standard_cycle_time_minutes: 474

trims:
  levels: ["Base", "Comfort", "Luxury"]
  price_premium_multiplier: [0.0, 0.07, 0.14]

colors:
  count: 8
  definitions:
    - {color_name: "Arctic White", color_type: "Solid", price_premium: 0}
    - {color_name: "Midnight Black", color_type: "Solid", price_premium: 0}
    - {color_name: "Steel Grey", color_type: "Metallic", price_premium: 350}
    - {color_name: "Ocean Blue", color_type: "Metallic", price_premium: 350}
    - {color_name: "Crimson Red", color_type: "Metallic", price_premium: 400}
    - {color_name: "Forest Green", color_type: "Metallic", price_premium: 400}
    - {color_name: "Pearl Ivory", color_type: "Pearl", price_premium: 600}
    - {color_name: "Copper Bronze", color_type: "Pearl", price_premium: 600}

upholstery:
  definitions:
    - {material: "Fabric", color: "Black", price_premium: 0}
    - {material: "Leatherette", color: "Grey", price_premium: 250}
    - {material: "Leather", color: "Beige", price_premium: 900}
    - {material: "Leather", color: "Black", price_premium: 900}

suppliers:
  count: 12
  reliability_score_range: [60, 99] 
  lead_time_days_range: [3, 45]

parts:
  count: 40
  categories: ["Engine", "Chassis", "Electrical", "Interior", "Exterior", "Powertrain", "Safety"]
  unit_cost_range_by_category:
    Engine: [800, 3200]
    Chassis: [150, 900]
    Electrical: [40, 600]
    Interior: [30, 700]
    Exterior: [50, 500]
    Powertrain: [500, 2800]
    Safety: [60,450]
  complexity_score_range: [1, 10]

workstations:
  count: 20
  type_sequence:
    # Ordered workstations list of the car production line.
    - "Welding"
    - "Welding"
    - "Welding"
    - "Painting"
    - "Painting"
    - "Powertrain Assembly"
    - "Powertrain Assembly"
    - "Chassis Assembly"
    - "Chassis Assembly"
    - "Interior Assembly"
    - "Interior Assembly"
    - "Interior Assembly"
    - "Electrical Assembly"
    - "Electrical Assembly"
    - "Exterior Trim"
    - "Exterior Trim"
    - "Safety Systems"
    - "Final Assembly"
    - "Quality Check"
    - "Quality Check"
  standard_cycle_time_range_minutes: [12, 35]

workers:
  count: 150
  skill_levels: ["Junior", "Mid", "Senior"]
  skill_level_weights: [0.30, 0.45, 0.25]
  hourly_wage_range:
    Junior: [12, 18]
    Mid: [18, 26]
    Senior: [26, 38]
  hire_date_range: ["2015-01-01", "2025-06-01"]

shifts:
  definitions:
    - {shift_name: "Morning", start_time: "06:00", end_time: "14:00"}
    - {shift_name: "Evening", start_time: "14:00", end_time: "22:00"}
    - {shift_name: "Night",   start_time: "22:00", end_time: "06:00"}

production:
  daily_target_mean: 80
  daily_target_std: 10
  # The factory operates on a reduced schedule over the weekends.
  weekend_reduction_factor: 0.35

station_operations:
  downtime_probability_base: 0.045
  downtime_minutes_range: [5, 45]
  downtime_reason_weights: {"Machine Failure": 0.50, "Material Shortage": 0.30, "Changeover": 0.20}
  cycle_time_factor_by_skill:
    Junior: {mean: 1.15, std: 0.20}
    Mid:    {mean: 1.00, std: 0.12}
    Senior: {mean: 0.90, std: 0.08}
  downtime_multiplier_by_skill: {Junior: 1.3, Mid: 1.0, Senior: 0.8}
  downtime_multiplier_by_shift: {Morning: 0.9, Evening: 1.0, Night: 1.15}

defects:
  base_rate: 0.012 # Base defect rate
  skill_multiplier: {Junior: 1.6, Mid: 1.0, Senior: 0.6}
  shift_multiplier: {Morning: 0.9, Evening: 1.0, Night: 1.25}
  downtime_multiplier: 2.0 #  downtime cause 2.0 defects
  supplier_reliability_scale: 1.5   # Reliability of supply effects the defects.
  complexity_scale: 0.8             
  qc_station_dampener: 0.2          # extra defects that dedected by qc station.
  max_probability_cap: 0.15 # Cannot be more than 0.15 extra defect percentage.
  # The formula= base_rate*skill_multiplier*shift_multiplier*downtime_multiplier(1+(100-reliability_score)*1.5/100)*(1+(complexity_score-1)*0.8/9)
  station_type_defect_type:
    "Welding": "dimensional"
    "Painting": "cosmetic"
    "Chassis Assembly": "assembly"
    "Interior Assembly": "assembly"
    "Electrical Assembly": "electrical"
    "Exterior Trim": "cosmetic"
    "Powertrain Assembly": "functional"
    "Safety Systems": "functional"
    "Final Assembly": "assembly"
    "Quality Check": "dimensional"
  part_tied_station_categories:
    "Chassis Assembly": "Chassis"
    "Interior Assembly": "Interior"
    "Electrical Assembly": "Electrical"
    "Exterior Trim": "Exterior"
    "Powertrain Assembly": "Powertrain"
    "Safety Systems": "Safety"
  severity_weights_base: {minor: 0.74, major: 0.21, critical: 0.05}

material_usage:
  annual_inflation_rate: 0.045
  cost_noise_std: 0.02

costing:
  # A worker's true cost to the company is more than the wage.
  # benefits,payroll tax, and facility overhead are typically added as a "burden rate".
  # 2.5x is a commonly cited multiplier in manufacturing cost accounting.
  labor_burden_multiplier: 2.5

output:
  format: "csv"
  directory: "data/raw"
